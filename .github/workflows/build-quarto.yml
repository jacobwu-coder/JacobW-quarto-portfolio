name: Build Quarto Site

on:
  push:
    branches: [ main ]
  pull_request:    
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Fetch funStuffs plots artifact via API (Python)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - << 'PY'
          import os, requests, zipfile, io

          # Configuration
          G = 'https://api.github.com'
          owner = 'jacobwu-coder'
          repo = 'funStuffs'
          workflow_name = 'Build and Upload Plots'
          artifact_name = 'funstuff-plots'
          headers = {
              'Authorization': f'token {os.environ.get("GITHUB_TOKEN")}',
              'Accept': 'application/vnd.github.v3+json'
          }

          # 1. Find latest successful workflow run
          runs_url = f'{G}/repos/{owner}/{repo}/actions/runs'
          r = requests.get(runs_url, headers=headers, timeout=30)
          if r.status_code != 200:
              print(f'Failed to list runs: {r.status_code}')
              raise SystemExit(1)

          data = r.json()
          run_id = None
          for run in data.get('workflow_runs', []):
              if run.get('name') == workflow_name and run.get('conclusion') == 'success':
                  run_id = run.get('id')
                  break

          if not run_id:
              print(f'No successful run found for: {workflow_name}')
              raise SystemExit(1)

          # 2. Find the specific artifact ID
          artifacts_url = f'{G}/repos/{owner}/{repo}/actions/runs/{run_id}/artifacts'
          r = requests.get(artifacts_url, headers=headers, timeout=30)
          arts = r.json().get('artifacts', [])
          artifact_id = next((a['id'] for a in arts if a['name'] == artifact_name), None)

          if not artifact_id:
              print('Artifact not found in run')
              raise SystemExit(1)

          # 3. Download and Extract
          download_url = f'{G}/repos/{owner}/{repo}/actions/artifacts/{artifact_id}/zip'
          rr = requests.get(download_url, headers=headers, timeout=60, stream=True)
          
          os.makedirs('external/funStuff/plots', exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(rr.content)) as z:
              z.extractall('external/funStuff/plots')
          print('Successfully extracted plots to external/funStuff/plots')
          PY

      - name: Render site
        run: quarto render index.qmd --to html --output index.html

      - name: Commit and Push (Built Site)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Use a temporary branch to avoid direct main conflicts
          git checkout -b built-index || git switch built-index
          
          git add index.html
          if [ -d external/funStuff/plots ]; then
            git add external/funStuff/plots
          fi

          if git diff --quiet --cached; then
            echo "No changes to commit"
          else
            git commit -m "ci: update built site (index + plots) [skip ci]"
            git push origin built-index --force
            # Note: PR creation requires the 'pull-requests: write' permission in the GITHUB_TOKEN
            gh pr create --title "chore: update built site" --body "Auto-update from CI" --base main --head built-index || echo "PR already exists"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quarto-site
          path: index.html
